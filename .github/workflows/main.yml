name: Build SkyWarden (Windows exe)

on:
  push:
    branches: [main]
    tags: ["v*"]          # pushing a tag like v0.1.0 also publishes a GitHub Release
  pull_request:
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write         # needed only to attach the exe to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the exe with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SkyWarden
          --icon assets/skywarden.ico
          --add-data "assets/skywarden.ico;assets"
          --hidden-import win32com.client
          --hidden-import pythoncom
          skywarden.py

      - name: Check the exe was built
        shell: pwsh
        run: |
          if (-not (Test-Path dist/SkyWarden.exe)) { throw "dist/SkyWarden.exe was not created" }
          Get-Item dist/SkyWarden.exe | Format-List Name, Length

      - name: Zip the exe
        shell: pwsh
        run: Compress-Archive -Path dist/SkyWarden.exe -DestinationPath SkyWarden-windows.zip

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: SkyWarden-windows
          path: SkyWarden-windows.zip
          if-no-files-found: error

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/SkyWarden.exe  SkyWarden-windows.zip
          generate_release_notes: true
