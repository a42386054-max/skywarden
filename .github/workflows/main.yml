name: Build SkyWarden (Windows exe)

on:
  push:
    branches: [main]      # every push to main builds the exe and publishes a Release
  pull_request:           # pull requests only build (no Release)
  workflow_dispatch:      # the "Run workflow" button on the Actions tab

permissions:
  contents: write         # lets the workflow create the tag and the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the exe with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SkyWarden
          --icon assets/skywarden.ico
          --add-data "assets/skywarden.ico;assets"
          --hidden-import win32com.client
          --hidden-import pythoncom
          --hidden-import catalog
          skywarden.py

      - name: Check the exe was built
        shell: pwsh
        run: |
          if (-not (Test-Path dist/SkyWarden.exe)) { throw "dist/SkyWarden.exe was not created" }
          Get-Item dist/SkyWarden.exe | Format-List Name, Length

      - name: Zip the exe
        shell: pwsh
        run: Compress-Archive -Path dist/SkyWarden.exe -DestinationPath SkyWarden-windows.zip

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: SkyWarden-windows
          path: SkyWarden-windows.zip
          if-no-files-found: error

      # Runs on every push (and manual run), but not on pull requests.
      # PyInstaller puts the exe in dist/, not build/, so the files below point there.
      - name: Create GitHub Release
        id: create_release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build Version ${{ github.run_number }}
          body: |
            Automated compilation from latest push.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            dist/SkyWarden.exe
            SkyWarden-windows.zip